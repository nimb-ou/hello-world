<!doctype html>
<html><head><meta charset="utf-8"><title>LORE device screens</title>
<link rel="stylesheet" href="../../assets/fonts.css">
<style>
:root{--ink:#14161A;--bone:#F3EEE6;--terra:#C4623A;--brass:#B8935A;--olive:#5E6B4E;--fog:#9AA0A6;--night:#0D1B2A;--signal:#D2392B;--dim:#5d6166}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Inter,sans-serif;color:var(--bone);-webkit-font-smoothing:antialiased}
.scr{position:relative;width:466px;height:466px;background:#000;border-radius:92px;overflow:hidden}
.abs{position:absolute}
.c{left:0;right:0;text-align:center}
.mono{font-family:"JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.serif{font-family:Fraunces,serif}
.cap{font-size:15px;color:var(--fog);font-family:"JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.status{position:absolute;top:30px;left:0;right:0;display:flex;justify-content:center;gap:14px;font:500 15px "JetBrains Mono";color:var(--fog);letter-spacing:.06em}
.status b{color:var(--bone);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;border:1.5px solid #34373c;font:500 14px "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;color:var(--fog)}
.chip.t{border-color:var(--terra);color:var(--terra)}
.row{display:flex;align-items:center;gap:18px;padding:15px 0;border-bottom:1px solid #222428}
.row:last-child{border:none}
.t1{font:500 22px Inter;color:var(--bone)}
.t2{font:400 16px Inter;color:var(--fog);margin-top:3px}
.btn{display:inline-block;padding:13px 26px;border-radius:99px;background:var(--bone);color:var(--ink);font:600 18px Inter}
.btn.ghost{background:none;border:1.5px solid #3a3d42;color:var(--bone)}
</style></head><body>
<div id="root"></div>
<script>
const Q = new URLSearchParams(location.search);
const arrow = (deg, col = 'var(--bone)', s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 30 30" style="transform:rotate(${deg}deg)"><path d="M15 3 L24 25 L15 20 L6 25Z" fill="${col}"/></svg>`;
const status = (extra = '') => `<div class="status"><span><b>14:32</b></span><span>LTE ▂▄▆</span><span>82%</span>${extra}</div>`;
function compassRing(r = 170, heading = 0, pois = []) {
  let s = `<svg class="abs" style="left:0;top:0" width="466" height="466" viewBox="0 0 466 466"><g transform="translate(233 233)">`;
  for (let d = 0; d < 360; d += 6) {
    const a = (d - heading) * Math.PI / 180, L = d % 90 === 0 ? 14 : d % 30 === 0 ? 9 : 5;
    const x1 = Math.sin(a) * r, y1 = -Math.cos(a) * r, x2 = Math.sin(a) * (r - L), y2 = -Math.cos(a) * (r - L);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${d % 90 === 0 ? '#9AA0A6' : '#3a3d42'}" stroke-width="${d % 90 === 0 ? 2.5 : 1.5}" stroke-linecap="round"/>`;
  }
  for (const [lab, d] of [['N', 0], ['E', 90], ['S', 180], ['W', 270]]) {
    const a = (d - heading) * Math.PI / 180;
    s += `<text x="${Math.sin(a) * (r + 22)}" y="${-Math.cos(a) * (r + 22) + 5}" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="${lab === 'N' ? '#C4623A' : '#5d6166'}">${lab}</text>`;
  }
  for (const p of pois) {
    const a = p.b * Math.PI / 180;
    s += `<circle cx="${Math.sin(a) * (r - 28)}" cy="${-Math.cos(a) * (r - 28)}" r="${p.big ? 7 : 4.5}" fill="${p.big ? '#C4623A' : '#9AA0A6'}"/>`;
  }
  s += `<path d="M0 ${-r - 2} l-9 -15 h18z" fill="#F3EEE6" transform="translate(0 ${0})"/></g></svg>`;
  return s;
}
const S = {};
S['01-home-compass'] = () => `${compassRing(178, 20, [{ b: -8, big: 1 }, { b: 64 }, { b: -70 }, { b: 140 }])}
  <div class="abs c cap" style="top:118px">Via dei Coronari</div>
  <div class="abs c serif" style="top:140px;font-size:104px;font-weight:300;letter-spacing:-.02em">14:32</div>
  <div class="abs c" style="top:282px;font:500 21px Inter">Pantheon <span style="color:var(--fog)">· 240 m ahead</span></div>
  <div class="abs c" style="top:318px"><span class="chip">☀ 19° · Rome</span></div>`;
S['02-now-narrating'] = () => `${status()}
  <div class="abs c cap" style="top:76px;color:var(--terra)">● Now narrating</div>
  <svg class="abs" style="left:73px;top:110px" width="320" height="120" viewBox="0 0 320 120">
    <path d="M30 110 A130 130 0 0 1 290 110" fill="none" stroke="#26282c" stroke-width="10" stroke-linecap="round"/>
    <path d="M30 110 A130 130 0 0 1 95 18" fill="none" stroke="#C4623A" stroke-width="10" stroke-linecap="round"/>
    <circle cx="160" cy="110" r="9" fill="#F3EEE6"/><text x="160" y="76" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#5d6166">AHEAD</text>
    <text x="22" y="72" font-family="Inter" font-weight="600" font-size="22" fill="#C4623A">◀ LEFT</text></svg>
  <div class="abs" style="left:52px;right:52px;top:250px;text-align:center"><div class="serif" style="font-size:31px;line-height:1.12;font-weight:400">Fontana dei<br>Quattro Fiumi</div>
  <div class="t2" style="margin-top:8px">Look up: the river god shields his eyes</div></div>
  <div class="abs" style="left:96px;right:96px;top:372px"><div style="height:4px;background:#26282c;border-radius:2px"><div style="width:56%;height:4px;background:var(--bone);border-radius:2px"></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:9px" class="cap"><span>0:18</span><span style="color:var(--brass)">2 sources</span><span>0:32</span></div></div>`;
S['03-nearby'] = () => `${status()}
  <div class="abs c cap" style="top:72px">Around you · clockwise</div>
  <div class="abs" style="left:58px;right:58px;top:100px">
  ${[[-75, 'Palazzo Pamphilj', 'Left · 60 m · Baroque palace'], [0, 'Pantheon', 'Ahead · 180 m · AD 126'], [38, 'Sant\'Agnese in Agone', 'Ahead-right · 90 m'], [95, 'Gelateria del 1938', 'Right · 90 m · open till 23:00']].map(([d, a, b], i) => `<div class="row">${arrow(d, i === 1 ? 'var(--terra)' : 'var(--bone)', 28)}<div><div class="t1">${a}</div><div class="t2">${b}</div></div></div>`).join('')}</div>`;
S['04-navigation'] = () => `${status()}
  <svg class="abs" style="left:143px;top:70px" width="180" height="200" viewBox="0 0 180 200"><path d="M70 190 V95 Q70 60 105 60 H130" fill="none" stroke="#B8935A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 22 L172 60 L122 98Z" fill="#B8935A"/></svg>
  <div class="abs c" style="top:268px"><span class="serif" style="font-size:72px;font-weight:300">30</span><span style="font:500 26px Inter;color:var(--fog)"> m</span></div>
  <div class="abs c" style="top:355px;font:500 22px Inter">Right onto Via della Palombella</div>
  <div class="abs c cap" style="top:392px">Pantheon · 4 min · 13:09</div>`;
S['05-listening'] = () => `${status()}
  <div class="abs c cap" style="top:80px;color:var(--terra)">Listening</div>
  <div class="abs" style="left:83px;top:130px;display:flex;align-items:center;gap:7px;height:100px">${[18, 34, 56, 80, 62, 92, 70, 48, 86, 60, 38, 66, 44, 26, 14].map((h) => `<div style="width:8px;height:${h}px;border-radius:4px;background:var(--terra)"></div>`).join('')}</div>
  <div class="abs" style="left:60px;right:60px;top:262px;text-align:center;font:400 25px/1.3 Fraunces;color:var(--bone)">“Somewhere good for dinner, not touristy, cacio e pepe…”</div>
  <div class="abs c cap" style="top:388px">Release to send</div>`;
S['06-answer'] = () => `${status()}
  <div class="abs" style="left:56px;right:56px;top:84px"><div class="cap" style="color:var(--brass)">Answer · from Rome pack</div>
  <div style="font:400 25px/1.35 Fraunces;margin-top:16px">The Pantheon's dome is still the world's largest <i>unreinforced</i> concrete dome, 43.3 m across. The same as its height.</div>
  <div class="t2" style="margin-top:14px">Source: Rome pack, ref. ARCH-0142</div></div>
  <div class="abs c" style="top:368px"><span class="btn">Tell me more</span></div>`;
S['07-dinner'] = () => `${status()}
  <div class="abs c cap" style="top:72px">Dinner · open now · cacio e pepe</div>
  <div class="abs" style="left:56px;right:56px;top:98px">
  ${[['Trattoria da Enzo*', '6 min · €16 · mostly Roman reviews', 1], ['Osteria Sant\'Ana*', '9 min · €14 · quiet courtyard'], ['Roscioli Salumeria*', '4 min · €18 · busy, book']].map(([a, b, f]) => `<div class="row"><div style="font:500 26px Fraunces;color:${f ? 'var(--terra)' : 'var(--fog)'};width:22px">${f ? '1' : '·'}</div><div style="flex:1"><div class="t1">${a}</div><div class="t2">${b}</div></div></div>`).join('')}</div>
  <div class="abs c" style="top:358px"><span class="btn">Book 20:15</span></div>
  <div class="abs c" style="top:416px;font:400 12px Inter;color:var(--dim)">*illustrative venues · LORE may earn a booking fee</div>`;
S['08-sos-countdown'] = () => `<div class="abs" style="inset:0;background:var(--signal)"></div>
  <div class="abs c mono" style="top:64px;font-size:17px;color:#fff;letter-spacing:.2em">SOS · calling for help</div>
  <div class="abs c serif" style="top:96px;font-size:200px;font-weight:300;color:#fff;line-height:1">3</div>
  <svg class="abs" style="left:73px;top:73px" width="320" height="320" viewBox="0 0 320 320"><circle cx="160" cy="160" r="150" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="6"/><circle cx="160" cy="160" r="150" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="942" stroke-dashoffset="377" transform="rotate(-90 160 160)" stroke-linecap="round"/></svg>
  <div class="abs c" style="top:330px;font:600 20px Inter;color:#fff">112 · Sara + 1 contact</div>
  <div class="abs c" style="top:362px;font:500 16px Inter;color:rgba(255,255,255,.85)">Press the crown to cancel</div>`;
S['09-sos-live'] = () => `<div class="abs" style="left:0;right:0;top:0;height:120px;background:var(--signal)"></div>
  <div class="abs c mono" style="top:44px;font-size:16px;color:#fff;letter-spacing:.2em">SOS active · 00:48</div>
  <div class="abs c" style="top:74px;font:600 21px Inter;color:#fff">Help is on the way</div>
  <div class="abs" style="left:58px;right:58px;top:132px">
  ${[['✓', '112 called', 'Connected 0:41'], ['✓', 'Sara, Tom notified', 'Live location · every 30 s'], ['◎', 'Satellite standby', 'Atlas NTN · used if LTE drops']].map(([i, a, b], k) => `<div class="row"><div style="width:26px;font:600 20px Inter;color:${k < 2 ? 'var(--bone)' : 'var(--fog)'}">${i}</div><div><div class="t1">${a}</div><div class="t2">${b}</div></div></div>`).join('')}</div>
  <div class="abs c cap" style="top:396px">Hold SOS 2 s to end</div>`;
S['10-walk-me-home'] = () => `${status('<span style="color:var(--brass)">♥</span>')}
  <div class="abs c cap" style="top:74px;color:var(--brass)">Walk me home</div>
  <svg class="abs" style="left:63px;top:104px" width="340" height="150" viewBox="0 0 340 150"><path d="M20 120 C80 120 90 40 160 50 S260 110 320 30" fill="none" stroke="#2a2c30" stroke-width="8" stroke-linecap="round"/><path d="M20 120 C80 120 90 40 160 50" fill="none" stroke="#B8935A" stroke-width="8" stroke-linecap="round"/><circle cx="160" cy="50" r="11" fill="#F3EEE6"/><circle cx="320" cy="30" r="7" fill="none" stroke="#F3EEE6" stroke-width="3"/><text x="300" y="62" font-family="JetBrains Mono" font-size="12" fill="#9AA0A6">HOTEL</text></svg>
  <div class="abs c" style="top:268px"><span class="serif" style="font-size:64px;font-weight:300">8</span><span style="font:500 24px Inter;color:var(--fog)"> min</span></div>
  <div class="abs c" style="top:346px;font:500 19px Inter">Sara can see you · ETA 23:56</div>
  <div class="abs c cap" style="top:382px">Via Nazionale · lit route</div>`;
S['11-battery'] = () => `${status()}
  <div class="abs c" style="top:76px"><span class="serif" style="font-size:96px;font-weight:300">62</span><span style="font:500 28px Inter;color:var(--fog)">%</span></div>
  <div class="abs c" style="top:190px;font:500 19px Inter;color:var(--fog)">About 1 day 6 h left at today's pace</div>
  <div class="abs" style="left:56px;right:56px;top:236px">
  ${[['Normal', 'Everything on', 1], ['Saver', 'AOD off · L1 GNSS · auto at 20 %'], ['Ultra', 'Nav + safety only · auto at 8 %']].map(([a, b, on]) => `<div class="row"><div style="width:22px;height:22px;border-radius:50%;border:2px solid ${on ? 'var(--terra)' : '#3a3d42'};display:grid;place-items:center">${on ? '<div style="width:10px;height:10px;border-radius:50%;background:var(--terra)"></div>' : ''}</div><div><div class="t1">${a}</div><div class="t2">${b}</div></div></div>`).join('')}</div>`;
S['12-nightstand'] = () => `<div class="abs c serif" style="top:110px;font-size:120px;font-weight:300;color:#8a7f70">06:45</div>
  <div class="abs c cap" style="top:262px;color:#6d6458">Alarm · tomorrow</div>
  <div class="abs c" style="top:300px;font:400 19px Fraunces;color:#8a7f70">First walk: Trastevere at 09:30 · 21°, clear</div>
  <div class="abs c" style="top:350px"><span style="display:inline-block;width:110px;height:5px;border-radius:3px;background:#2a2c30"><span style="display:block;width:78%;height:5px;border-radius:3px;background:#5E6B4E"></span></span></div>`;
S['13-city-pack'] = () => `${status()}
  <div class="abs c cap" style="top:74px">City pack</div>
  <div class="abs c serif" style="top:98px;font-size:56px;font-weight:400">Rome</div>
  <svg class="abs" style="left:153px;top:176px" width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" fill="none" stroke="#26282c" stroke-width="8"/><circle cx="80" cy="80" r="70" fill="none" stroke="#C4623A" stroke-width="8" stroke-dasharray="440" stroke-dashoffset="158" transform="rotate(-90 80 80)" stroke-linecap="round"/><text x="80" y="90" text-anchor="middle" font-family="Fraunces" font-weight="300" font-size="38" fill="#F3EEE6">64%</text></svg>
  <div class="abs c" style="top:352px;font:500 18px Inter">780 MB of 1.2 GB · Wi-Fi</div>
  <div class="abs c cap" style="top:384px">2,140 stories · maps · on-device model</div>`;
S['14-settings'] = () => `${status()}
  <div class="abs c cap" style="top:72px">Settings</div>
  <div class="abs" style="left:56px;right:56px;top:96px">
  ${[['Story frequency', 'Every 4 min'], ['Story length', 'Short · 20–40 s'], ['Voice', 'Isla · English'], ['Quiet hours', '22:30 – 08:00'], ['Rotate 180°', 'Left-hand']].map(([a, b], i) => `<div class="row" style="justify-content:space-between"><div class="t1" style="font-size:20px">${a}</div><div class="t2" style="margin:0;color:${i === 0 ? 'var(--terra)' : 'var(--fog)'}">${b}</div></div>`).join('')}</div>`;
S['15-offline'] = () => `${compassRing(178, 300, [{ b: 30, big: 1 }, { b: -50 }, { b: 120 }])}
  <div class="abs c" style="top:106px"><span class="chip">◌ Offline · Rome pack</span></div>
  <div class="abs c serif" style="top:146px;font-size:96px;font-weight:300">21:07</div>
  <div class="abs c" style="top:276px;font:500 20px Inter">Stories, maps, routes · all here</div>
  <div class="abs c t2" style="top:306px">Live hours & booking when back online</div>`;
const ids = Object.keys(S);
const one = Q.get('s');
const root = document.getElementById('root');
if (one) { root.innerHTML = `<div class="scr" id="cap">${S[one]()}</div>`; }
else { // contact sheet
  document.body.style.background = '#E9E4DB'; document.body.style.padding = '64px';
  root.innerHTML = `<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:40px;color:#14161A"><div style="font:400 44px Fraunces">LORE Square / Atlas · screen system</div><div style="font:500 15px 'JetBrains Mono';letter-spacing:.12em;color:#6b6f75">1.6" AMOLED · 466 × 466 · EVT-0</div></div>
  <div style="display:grid;grid-template-columns:repeat(5,466px);gap:40px 36px">${ids.map((k) => `<div><div class="scr" style="box-shadow:0 0 0 10px #1b1d21, 0 0 0 11px #3b3c40">${S[k]()}</div><div style="margin-top:22px;font:500 15px 'JetBrains Mono';letter-spacing:.1em;color:#4a4d52;text-transform:uppercase">${k.replace('-', ' · ').replace(/-/g, ' ')}</div></div>`).join('')}</div>`;
}
window.__ids = ids; window.__done = true;
</script></body></html>
