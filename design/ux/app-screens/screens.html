<!doctype html>
<html><head><meta charset="utf-8"><title>LORE companion app screens</title>
<!--
  LORE companion app (iOS reference, 390 x 844 pt). One file, three views:
    ?s=<id>          one screen (captured as #cap)
    (no params)      labelled contact sheet (#sheet)
    ?view=mockup     3 screens in phone frames on Bone (#sheet)
  Rendered by ux/scripts/render-app-screens.mjs. Device images are the real device screens,
  embedded from ../device-screens/screens.html?frame=1.
-->
<link rel="stylesheet" href="../../assets/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E4DB;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.light{--bg:#F3EEE6;--card:#FBF8F2;--sunk:#EAE3D7;--fg:#14161A;--mut:#5C5F66;--soft:#848280;--hair:#DDD6CA;--acc:#C4623A;--acct:#A84E2A;--bar:rgba(243,238,230,.94);--inv:#F3EEE6}
.dark{--bg:#14161A;--card:#1D1F23;--sunk:#1A1C20;--fg:#F3EEE6;--mut:#9AA0A6;--soft:#6c7076;--hair:#2C2E33;--acc:#D9774E;--acct:#E59A78;--bar:rgba(20,22,26,.94);--inv:#14161A}
.night{--bg:#0D1B2A;--card:#13263A;--sunk:#102234;--fg:#F3EEE6;--mut:#9AA0A6;--soft:#6f7f90;--hair:#22364B;--acc:#D9774E;--acct:#E59A78;--bar:rgba(13,27,42,.94);--inv:#0D1B2A}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--fg)}
.abs{position:absolute}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0 40px;font:600 17px Inter;letter-spacing:-.01em;color:var(--fg);z-index:20}
.hi{position:absolute;bottom:8px;left:128px;width:134px;height:5px;border-radius:3px;background:var(--fg);z-index:30}
.ov{font:500 11px "JetBrains Mono";letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.h1{font:400 34px/1.08 Fraunces;letter-spacing:-.012em}
.h2{font:400 24px/1.15 Fraunces;letter-spacing:-.006em}
.body{font:400 15px/1.5 Inter;color:var(--mut)}
.pad{position:absolute;left:24px;right:24px}
.card{background:var(--card);border-radius:20px}
.hair{border-bottom:1px solid var(--hair)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:28px;font:600 17px Inter;letter-spacing:-.01em}
.btn.pri{background:var(--acc);color:#F3EEE6}
.btn.ink{background:var(--fg);color:var(--inv)}
.btn.ghost{border:1.5px solid var(--hair);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;border:1.25px solid var(--hair);font:500 14px Inter;color:var(--fg);white-space:nowrap}
.pill.on{background:var(--fg);border-color:var(--fg);color:var(--inv)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0}
.t1{font:500 16px Inter;color:var(--fg);letter-spacing:-.01em}
.t2{font:400 13.5px/1.4 Inter;color:var(--mut);margin-top:2px}
.mono{font:500 12px "JetBrains Mono";letter-spacing:.06em}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--bar);border-top:1px solid var(--hair);display:flex;justify-content:space-around;padding:9px 18px 0;z-index:25}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;font:500 10.5px Inter;color:var(--soft)}
.tab.on{color:var(--fg)}
.tog{flex:none;width:51px;height:31px;border-radius:16px;background:var(--hair);position:relative}
.tog i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.tog.on{background:var(--fg)}.tog.on i{left:22px;background:var(--inv)}
.av{flex:none;display:grid;place-items:center;border-radius:50%;font:italic 400 20px Fraunces}
.devframe{position:relative}
.devframe iframe{position:absolute;left:0;top:0;width:1000px;height:1000px;border:0;transform-origin:0 0;background:transparent}
</style></head><body>
<div id="root"></div>
<script>
const Q = new URLSearchParams(location.search);
// ---------- icons (1.5 px stroke, round caps: brand §11) ----------
const P = {
  today: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  map: '<path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/>',
  packs: '<path d="M12 3 21 8l-9 5-9-5z"/><path d="m3 12.5 9 5 9-5M3 16.5l9 5 9-5"/>',
  you: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  chevL: '<path d="M15 5 8 12l7 7"/>', chevR: '<path d="m9 5 7 7-7 7"/>', close: '<path d="M6 6l12 12M18 6 6 18"/>',
  check: '<path d="M5 12.5 10 17l9-10"/>', plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  share: '<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  star: '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/>',
  lookup: '<path d="M3 15.5c2.7-3.4 5.7-5 9-5s6.3 1.6 9 5c-2.7 3.4-5.7 5-9 5s-6.3-1.6-9-5z"/><circle cx="12" cy="15.5" r="2.4"/><path d="M7 6.5Q12 2 17 6.5"/>',
  shield: '<path d="M12 3 5 6v5.5c0 4.6 3 8 7 9.5 4-1.5 7-4.9 7-9.5V6z"/>',
  route: '<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/>',
  head: '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4" height="6.5" rx="1.6"/>',
  wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r=".9"/>',
  down: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>', chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2.5v3.5M15 2.5v3.5M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/>',
  bubble: '<path d="M4 5h16v11H9l-5 4z"/>', lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20"/>',
  locate: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  pin: '<path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  quote: '<path d="M5 18c0-5 1.5-8.5 5-10M14 18c0-5 1.5-8.5 5-10"/>',
};
const I = (n, s = 24, c = 'currentColor', w = 1.5) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:block">${P[n]}</svg>`;
const sb = (t = '9:41') => `<div class="sb"><span>${t}</span><span style="display:flex;gap:7px;align-items:center">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A7 7 0 0 0 8 4 7 7 0 0 0 3.3 5.8L4.4 7c1-.9 2.2-1.4 3.6-1.4zM8 9l2.2-1.9a3.4 3.4 0 0 0-4.4 0z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg></span></div>`;
const hi = '<div class="hi"></div>';
const tabs = (on) => `<div class="tabs">${[['today', 'Today'], ['map', 'Map'], ['packs', 'Packs'], ['you', 'You']].map(([k, l]) => `<div class="tab ${on === k ? 'on' : ''}">${I(k, 25)}${l}</div>`).join('')}</div>`;
const tog = (on) => `<div class="tog ${on ? 'on' : ''}"><i></i></div>`;
const device = (screen, size) => { const sc = size / 876; return `<div class="devframe" style="width:${size + 44 * sc}px;height:${size}px"><iframe src="../device-screens/screens.html?frame=1&s=${screen}" style="transform:translate(${-80 * sc}px,${-62 * sc}px) scale(${sc})"></iframe></div>`; };

// Pantheon elevation: single-weight line drawing, one detail (the inscription you look up at) in Terracotta (brand §12)
function pantheon(w, stroke, accent, sw = 1.2) {
  let s = `<svg viewBox="0 0 320 190" width="${w}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="display:block">`;
  s += `<path d="M96 46 A 66 32 0 0 1 224 46"/><path d="M118 30 h84" opacity=".55"/><path d="M152 15.5 h16 v-4 h-16z"/>`;
  s += `<path d="M84 46 H236 M70 70 V52 H250 V70"/><path d="M70 52 L160 40 L250 52" opacity=".55"/>`;
  s += `<path d="M30 98 L160 62 L290 98 Z"/><path d="M46 94 L160 68.5 L274 94" opacity=".55"/>`;
  s += `<rect x="34" y="98" width="252" height="18"/>`;
  s += `<text x="160" y="110.2" text-anchor="middle" fill="${accent}" stroke="none" font-family="Fraunces" font-size="7.4" letter-spacing="1.25">M·AGRIPPA·L·F·COS·TERTIVM·FECIT</text>`;
  for (let i = 0; i < 8; i++) { const x = 44 + i * 31.4; s += `<rect x="${x - 2}" y="116" width="16" height="5"/><path d="M${x} 121 V166 M${x + 12} 121 V166" /><path d="M${x + 6} 124 V163" opacity=".35"/><rect x="${x - 2}" y="166" width="16" height="4"/>`; }
  s += `<path d="M24 170 H296 V176 H24 Z M16 176 H304 V182 H16 Z"/><path d="M0 182 H320" opacity=".55"/></svg>`;
  return s;
}
// seeded RNG for the stylised map
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }

// Stylised Centro Storico map, north up, ~3 m per px. Not real tiles.
function romeMap() {
  const r = rng(7); let blocks = '';
  for (let gy = -1; gy < 22; gy++) for (let gx = -1; gx < 16; gx++) {
    const x0 = gx * 27 + (gy % 2) * 9, y0 = gy * 23;
    const split = r() < .35;
    const w = 27 - 4 - r() * 3, h = 23 - 4 - r() * 3;
    if (split) { const a = w * (.4 + r() * .2); blocks += `<rect x="${x0}" y="${y0}" width="${a - 2}" height="${h}" rx="2"/><rect x="${x0 + a + 1}" y="${y0}" width="${w - a - 1}" height="${h}" rx="2"/>`; }
    else blocks += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="2"/>`;
  }
  const road = (d, w = 11) => `<path d="${d}" stroke="#D9D0BF" stroke-width="${w + 2}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#FAF7F1" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const corso = 'M-10 300 C 60 325, 110 345, 170 358 S 260 385, 330 398 L 400 402';
  return `<svg class="abs" style="left:0;top:0" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#EFE9DE"/>
  <g fill="#E3DACA" transform="rotate(-7 195 300)">${blocks}</g>
  ${road(corso, 13)}${road('M196 90 L 192 372', 9)}${road('M-10 140 L 128 176', 7)}${road('M196 252 L 272 244', 6)}${road('M376 -10 L 384 520', 10)}${road('M142 412 L 262 420', 6)}${road('M150 312 L 128 392', 6)}${road('M300 280 L 296 396', 6)}
  <path d="M-30 30 C 30 120, 55 220, 25 300 S -5 430, 55 560" stroke="#C9D3CF" stroke-width="46" fill="none"/>
  <path d="M-30 30 C 30 120, 55 220, 25 300 S -5 430, 55 560" stroke="#BFCBC7" stroke-width="1" fill="none" transform="translate(23 0)"/>
  <rect x="133" y="186" width="36" height="128" rx="18" fill="#F7F3EC" stroke="#D3C9B7"/>
  <rect x="264" y="194" width="52" height="34" rx="3" fill="#F7F3EC" stroke="#D3C9B7"/>
  <circle cx="290" cy="262" r="19" fill="#D6CBB8"/><rect x="279" y="228" width="22" height="18" fill="#D6CBB8"/>
  <rect x="102" y="396" width="42" height="30" rx="3" fill="#F7F3EC" stroke="#D3C9B7" transform="rotate(-8 123 411)"/>
  <rect x="260" y="400" width="62" height="40" rx="3" fill="#E9E1D2" stroke="#D3C9B7"/>
  ${[[274, 412], [288, 410], [302, 413], [280, 426], [298, 428]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#CFC3AE"/>`).join('')}
  <path id="corso" d="${corso}" fill="none"/>
  <text font-family="JetBrains Mono" font-size="7.5" letter-spacing="1.6" fill="#8d8a84"><textPath href="#corso" startOffset="34%">CORSO VITTORIO EMANUELE II</textPath></text>
  <text x="22" y="150" font-family="JetBrains Mono" font-size="7.5" letter-spacing="1.4" fill="#8d8a84" transform="rotate(15 22 150)">VIA DEI CORONARI</text>
  <text x="34" y="236" font-family="Fraunces" font-style="italic" font-size="13" fill="#7f8f8b" transform="rotate(84 34 236)">Tevere</text>
  <g font-family="Fraunces" font-style="italic" font-size="13.5" fill="#55565a">
    <text x="126" y="204" text-anchor="end">Piazza</text><text x="126" y="220" text-anchor="end">Navona</text>
    <text x="322" y="292">Pantheon</text>
    <text x="96" y="452">Campo de' Fiori</text>
    <text x="291" y="458" text-anchor="middle">Largo di Torre Argentina</text></g>
  <path d="M286 236 L 252 241 L 198 249 L 196 300 L 178 306 L 168 292 L 166 266" fill="none" stroke="#14161A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 262 L 160 312 L 150 330 L 132 392" fill="none" stroke="#14161A" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" opacity=".7"/>
  <path d="M166 266 L 152 228 A 40 40 0 0 1 180 228 Z" fill="#14161A" opacity=".12"/>
  <circle cx="150" cy="248" r="20" fill="#C4623A" opacity=".14"/><circle cx="150" cy="248" r="12" fill="#C4623A" stroke="#F7F3EC" stroke-width="2.5"/><text x="150" y="252.5" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#F7F3EC">3</text>
  <circle cx="300" cy="262" r="11" fill="#14161A" stroke="#F7F3EC" stroke-width="2.5"/><text x="300" y="266" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10" fill="#F7F3EC">2</text>
  <circle cx="122" cy="411" r="9" fill="#F7F3EC" stroke="#14161A" stroke-width="1.6"/><circle cx="291" cy="420" r="9" fill="#F7F3EC" stroke="#14161A" stroke-width="1.6"/>
  <circle cx="166" cy="266" r="8.5" fill="#14161A" stroke="#F7F3EC" stroke-width="3"/>
  <g transform="translate(316 140)"><rect x="0" y="0" width="64" height="26" rx="13" fill="#FBF8F2" stroke="#D3C9B7"/><text x="10" y="17" font-family="Inter" font-weight="500" font-size="11.5" fill="#14161A">Trevi ↗</text></g>
  </svg>`;
}
// small schematic of the whole day for the recap
function dayMap() {
  const pts = [[268, 30, '1'], [214, 52, '2'], [160, 54, '3'], [150, 82, '4'], [212, 84, '5'], [178, 116, '6']];
  return `<svg width="342" height="140" viewBox="0 0 342 140" style="display:block">
  <rect width="342" height="140" rx="18" fill="#EAE3D7"/>
  <path d="M70 -10 C 120 40, 128 80, 104 110 S 96 160, 140 190" stroke="#D3DAD6" stroke-width="22" fill="none"/>
  <path d="M${pts.map((p) => p[0] + ' ' + p[1]).join(' L ')}" fill="none" stroke="#14161A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(([x, y, n], i) => `<circle cx="${x}" cy="${y}" r="9.5" fill="${i === 5 ? '#C4623A' : '#14161A'}" stroke="#EAE3D7" stroke-width="2"/><text x="${x}" y="${y + 3.6}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="9.5" fill="#F3EEE6">${n}</text>`).join('')}
  <text x="18" y="26" font-family="JetBrains Mono" font-size="9" letter-spacing="1.4" fill="#848280">09:40 → 18:55</text>
  <text x="194" y="120" font-family="Fraunces" font-style="italic" font-size="11.5" fill="#5C5F66">Aventine</text></svg>`;
}

const S = {};
// 01 · Welcome (Ink: brand moment, reverse lockup)
S['01-welcome'] = () => `<div class="ph dark">${sb()}
  <div class="abs" style="left:32px;top:96px;display:flex;align-items:center;gap:12px"><img src="../../assets/brand/lore-symbol-terracotta.svg" style="width:30px"><img src="../../assets/brand/lore-wordmark-bone.svg" style="height:19px"></div>
  <div class="abs" style="left:32px;right:28px;top:196px;font:300 48px/1.04 Fraunces;letter-spacing:-.018em">Every street<br>has a story.<br><i style="color:var(--acc)">Let's hear it.</i></div>
  <div class="abs body" style="left:32px;right:40px;top:376px;font-size:16.5px">LORE tells you the city through your own earphones: its history, the hidden details, the way home. Your phone stays in your pocket.</div>
  <div class="abs" style="left:24px;top:500px;opacity:.9">${pantheon(342, '#3d4046', '#D9774E', 1.1)}</div>
  <div class="pad" style="top:706px"><div class="btn" style="background:#F3EEE6;color:#14161A">Get started</div></div>
  <div class="abs" style="left:0;right:0;top:778px;text-align:center;font:500 15px Inter;color:var(--mut)">I already have an account</div>${hi}</div>`;
// 02 · Pair
S['02-pair'] = () => `<div class="ph light">${sb()}
  <div class="abs" style="left:16px;top:58px">${I('chevL', 28)}</div><div class="abs ov" style="left:0;right:0;top:66px;text-align:center">Step 2 of 5</div>
  <div class="pad h1" style="top:112px">Say hello to<br>your LORE.</div>
  <div class="pad body" style="top:200px">Keep it next to your phone. When the keyhole appears, press and hold the Talk key.</div>
  <div class="abs" style="left:40px;top:276px">${device('x-pair', 250)}</div>
  <div class="abs" style="left:302px;top:438px;width:40px;border-top:1.25px solid #14161A"></div>
  <div class="abs" style="left:348px;top:429px;font:600 12.5px Inter;color:var(--acct);line-height:1.3">Talk<br><span style="font-weight:400;color:var(--mut)">hold</span></div>
  <div class="pad card" style="top:566px;padding:16px 18px;display:flex;align-items:center;gap:14px">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--sunk);display:grid;place-items:center">${I('wifi', 22)}</div>
    <div style="flex:1"><div class="t1">LORE Square · Ink</div><div class="t2">S1-4F2A · 20 cm away</div></div>
    <div class="mono" style="color:var(--acct);font-size:11px">WAITING</div></div>
  <div class="pad" style="top:652px">${[['globe', 'Global eSIM turns on by itself', '150+ countries, no roaming bill'], ['chip', 'LORE OS 1.4.2', 'Already up to date']].map(([i, a, b]) => `<div class="row" style="padding:9px 0">${I(i, 22, 'var(--mut)')}<div><div class="t1" style="font-size:15px">${a}</div><div class="t2">${b}</div></div></div>`).join('')}</div>
  <div class="abs" style="left:0;right:0;top:786px;display:flex;justify-content:center;gap:8px">${[0, 1, 0, 0, 0].map((a, i) => `<span style="width:${a ? 22 : 7}px;height:7px;border-radius:4px;background:${i <= 1 ? 'var(--fg)' : 'var(--hair)'}"></span>`).join('')}</div>${hi}</div>`;
// 03 · Interests + narrator persona
S['03-interests-persona'] = () => `<div class="ph light">${sb()}
