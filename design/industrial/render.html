<script type="module">

// ---- screen texture: real UX mockup if rendered, else a canvas fallback
async function screenTex(name = 'home') {
  const files = { home: '../ux/device-screens/png/01-home-compass.png', narr: '../ux/device-screens/png/02-now-narrating.png', clock: '../ux/device-screens/png/12-nightstand.png', nav: '../ux/device-screens/png/04-navigation.png' };
  try {
    const r = await fetch(files[name]); if (!r.ok) throw 0;
    // draw into a canvas: WebGL ignores flipY for ImageBitmap, which rendered the UI upside-down
    const img = await createImageBitmap(await r.blob()); const cv = document.createElement('canvas'); cv.width = cv.height = 932; cv.getContext('2d').drawImage(img, 0, 0, 932, 932);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  } catch {
    const c = document.createElement('canvas'); c.width = c.height = 932; const g = c.getContext('2d'); g.scale(2, 2);
    g.fillStyle = '#000'; g.fillRect(0, 0, 466, 466);
    g.strokeStyle = 'rgba(243,238,230,.18)'; g.lineWidth = 2; g.beginPath(); g.arc(233, 233, 170, 0, 7); g.stroke();
    g.strokeStyle = '#C4623A'; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.arc(233, 233, 170, -1.95, -1.2); g.stroke();
    g.fillStyle = '#F3EEE6'; g.textAlign = 'center'; g.font = '300 92px Fraunces'; g.fillText('14:32', 233, 250);
    g.font = '500 17px Inter'; g.fillStyle = '#9AA0A6'; g.letterSpacing = '3px'; g.fillText('VIA DEI CORONARI', 233, 292);
    g.font = '400 19px Inter'; g.fillStyle = '#F3EEE6'; g.letterSpacing = '0px'; g.fillText('Pantheon · 240 m ahead', 233, 330);
    g.fillStyle = '#C4623A'; g.beginPath(); g.moveTo(233, 52); g.lineTo(224, 70); g.lineTo(242, 70); g.fill();
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
}
const home = await screenTex('home');

}

  st.target.set(0, 22, 0); ttl('Colourways', 'Pebble: Bone · Ink · Terracotta  /  Square: Ink · Sand  /  Atlas: Titanium · Black DLC');
  cap('Soft-touch PC-GF10 · anodised 6013 aluminium · Grade 5 titanium (bead-blast / DLC)');
  return persp(16, [0, 115, 1300], [0, 30, 0]); };

S['colourways-square'] = (st) => { cap('Ink · Sand — bead-blast + Type II anodise, diamond-cut chamfer, Terracotta Talk key'); return colourway(st, 'square', ['sq-ink', 'sq-sand'], 'Square colourways', 'Ink · Sand', 0xD9D3C8); };
S['colourways-atlas'] = (st) => { cap('Bead-blasted titanium · Black DLC titanium — sapphire, ZrN brass-tone crown'); return colourway(st, 'atlas', ['at-ti', 'at-dlc'], 'Atlas colourways', 'Titanium · Black DLC', 0xCFC9BF); };
for (const [sku, f, bg] of [['pebble', 'bone', 0xE6E0D6], ['pebble', 'ink', 0xD6D0C6], ['pebble', 'terracotta', 0xE6DDD0], ['square', 'sq-ink', 0xD3CCC1], ['square', 'sq-sand', 0xDCCFBC], ['atlas', 'at-ti', 0xCFC9BF], ['atlas', 'at-dlc', 0x2A2A2C]]) {
  S[`finish-${sku}-${f}`] = (st) => { st.scene.background.set(bg); st.floor.material.color.set(bg); if (bg === 0x2A2A2C) ov.classList.add('dark');
    const o = sku === 'pebble' ? G.buildPebble(PR, f, { led: LED }) : dev(sku, f);
    const a = placeOnFloor(flat(o, -0.6)); a.position.x = -30; st.scene.add(a);
    const o2 = sku === 'pebble' ? G.buildPebble(PR, f) : dev(sku, f); o2.rotation.x = Math.PI / 2; const b = new THREE.Group(); b.add(o2); b.rotation.y = 0.5; placeOnFloor(b); b.position.x = 38; b.position.z = -10; st.scene.add(b);
    st.target.set(0, 5, 0); cap(`${PR[sku].name} · ${o.name.replace(PR[sku].name + ' ', '')} · front + back`);
    return persp(15, [0, 190, 260], [4, 3, -4]); };
}
function explodedShot(st, build, title, sub, span, bg = 0xE3DDD3) {
  st.scene.background.set(bg); st.floor.material.color.set(bg);
  const ex = build(); const root = new THREE.Group(); ex.rotation.x = -Math.PI / 2; root.add(ex); root.rotation.y = -0.5; st.scene.add(root);
  placeOnFloor(root, 4);
  st.target.set(0, 60, 0); st.keyDir.set(-0.4, 1, 0.45).normalize(); st.keySpread = 0.2;
  const cam = persp(17, [0, 190, 470], [0, 52, 0]);
  ttl(title, sub);
  root.updateMatrixWorld(true);
  const layers = ex.children[0].children.filter((c) => c.userData.label);
  st.after = () => {
    let svg = `<svg width="${W}" height="${H}">`;
    for (const L of layers) {
      const b = new THREE.Box3().setFromObject(L); const c = b.getCenter(new THREE.Vector3());
      const right = new THREE.Vector3(b.max.x, c.y, c.z);
      const p = project(cam, c, W, H), pr = project(cam, right, W, H);
      const x0 = Math.max(pr.x, p.x) + 20, xl = W * 0.70;
      svg += `<line x1="${x0}" y1="${p.y}" x2="${xl - 14}" y2="${p.y}" stroke="#8a857c" stroke-width="1.5"/><circle cx="${x0}" cy="${p.y}" r="4" fill="#C4623A"/>`;
      ov.insertAdjacentHTML('beforeend', `<div class="lab" style="left:${xl}px;top:${p.y - W / 160}px"><b>${L.userData.label}</b>${L.userData.sub ? `<span>${L.userData.sub}</span>` : ''}</div>`);
    }
    ov.insertAdjacentHTML('afterbegin', svg + '</svg>');
  };
  return cam;
}
S['exploded-square'] = (st) => { cap('Exploded stack · LORE Square S1 · internal component sizes are EVT-0 placeholders pending hardware/ layout');
  return explodedShot(st, () => G.buildSlateExploded(PR, 'square', 'sq-ink', { screenTexture: home, gap: 13 }), 'Square, exploded', '7 layers · 12.0 mm stack'); };
S['exploded-atlas'] = (st) => { cap('Exploded stack · LORE Atlas A1 · internal component sizes are EVT-0 placeholders');
  return explodedShot(st, () => G.buildSlateExploded(PR, 'atlas', 'at-ti', { screenTexture: home, gap: 13 }), 'Atlas, exploded', 'titanium · sapphire · Glance camera'); };
S['exploded-pebble'] = (st) => { cap('Exploded stack · LORE Pebble P1 · internal component sizes are EVT-0 placeholders');
  return explodedShot(st, () => G.buildPebbleExploded(PR, 'bone', { led: LED, gap: 10 }), 'Pebble, exploded', '6 layers · 14.0 mm stack'); };
S['scale-reference'] = (st) => { st.scene.background.set(0xEDE8DF); st.floor.material.color.set(0xEDE8DF);
  const put = (o, x, z, yaw = 0) => { const a = placeOnFloor(flat(o, yaw)); a.position.x = x; a.position.z = z; st.scene.add(a); return a; };
  put(G.buildCreditCard(), -95, 8); put(G.buildEuroCoin(), -95, -48);
  put(G.buildPebble(PR, 'bone', { led: LED }), -10, 0); put(dev('square', 'sq-ink'), 55, 0); put(dev('atlas', 'at-dlc'), 122, 0);
  st.target.set(15, 0, 0);
  ttl('Scale reference', 'ID-1 card 85.6 × 54.0 mm · €1 coin Ø23.25 mm');
  cap('Near-top view, 12.5° lens · Pebble 42 mm · Square 54 mm · Atlas 54 mm · scale bar at device plane');
  st.keyDir.set(-0.6, 0.8, 0.2).normalize(); st.keySpread = 0.18; st.sky.intensity = 0.25;
  const c = persp(12.5, [15, 1000, 420], [15, 0, 0]);
  st.after = () => { // 10 mm scale bar
    const a = project(c, new THREE.Vector3(100, 0, 52), W, H), b = project(c, new THREE.Vector3(150, 0, 52), W, H);
    ov.insertAdjacentHTML('beforeend', `<svg width="${W}" height="${H}"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#2a2c30" stroke-width="3"/>${[0, 1, 2, 3, 4, 5].map((k) => `<line x1="${a.x + (b.x - a.x) * k / 5}" y1="${a.y - 10}" x2="${a.x + (b.x - a.x) * k / 5}" y2="${a.y}" stroke="#2a2c30" stroke-width="2"/>`).join('')}<text x="${(a.x + b.x) / 2}" y="${a.y + 34}" font-family="JetBrains Mono" font-size="${W / 110}" fill="#2a2c30" text-anchor="middle">50 mm</text></svg>`);
  };

S['in-hand-square'] = (st) => { st.scene.background.set(0xCFC6B8); st.floor.material.color.set(0xCFC6B8);
  const hand = G.buildHand(); const h = placeOnFloor(flat(hand, 0.25)); st.scene.add(h);
  const d = dev('square', 'sq-sand'); const a = flat(d, 0.1); a.position.set(-4, 24, 2); st.scene.add(a);
  st.target.set(0, 20, 0); st.keyDir.set(-0.45, 1, 0.3).normalize();

S['in-hand-pebble'] = (st) => { st.scene.background.set(0xCFC6B8); st.floor.material.color.set(0xCFC6B8);
  const hand = G.buildHand(); const h = placeOnFloor(flat(hand, -0.2)); st.scene.add(h);

// orthographic views (white, technical)
for (const sku of ['pebble', 'square', 'atlas']) {
  const fin = { pebble: 'bone', square: 'sq-ink', atlas: 'at-ti' }[sku];

    const c = ortho(150, [29, 0, 800], [29, 0, 0]);
    st.after = () => { const lab = (x, t) => { const p = project(c, new THREE.Vector3(x, -40, 0), W, H); ov.insertAdjacentHTML('beforeend', `<div class="lab" style="left:${p.x}px;top:${p.y}px;transform:translateX(-50%);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:.1em;color:#7c7a74">${t}</div>`); };
      lab(-50, 'Front'); lab(0, 'Right'); lab(48, 'Top'); lab(108, 'Back'); };

}

S['acc-clip'] = (st) => accShot(st, 0xDDD6CA, (sc) => { const c = G.buildClip(PR); const g = new THREE.Group(); c.rotation.x = -Math.PI / 2; c.rotation.z = 0.5; g.add(c); placeOnFloor(g); sc.add(g);
